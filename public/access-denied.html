<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport" />
  <title>403 - Access Restricted | Akash Nagapure</title>
  <meta name="robots" content="noindex, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

<!-- Cookie Consent Banner -->
<div id="cookie-banner" class="cookie-banner">
    <div class="cookie-content">
        <div class="cookie-icon"><i class="fa-solid fa-cookie"></i></div>
        <div class="cookie-text">
            <p>By clicking "Accept all cookies" you consent to cookies being stored on your device to improve website functionality and analyze site usage.</p>
            <a href="https://www.akashnagapure.in/privacy.html">Read Our Data Policy <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 11px;"></i></a>
        </div>
    </div>
    <div class="cookie-actions">
        <button id="deny-cookies-btn" type="button" class="btn btn-decline">Decline</button>
        <button id="accept-cookies-btn" type="button" class="btn btn-accept">Accept all cookies</button>
    </div>
</div>
<style>
.cookie-banner{position:fixed;bottom:0;left:0;width:100%;background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);border-top:2px solid #38bdf8;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 -4px 20px rgba(0,0,0,0.5);z-index:99999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transform:translateY(100%);transition:transform 0.4s ease}
.cookie-banner.show{transform:translateY(0)}
.cookie-content{display:flex;align-items:center;gap:16px}
.cookie-icon{font-size:28px;color:#38bdf8}
.cookie-text p{font-size:13px;color:#94a3b8;margin:0 0 4px 0;line-height:1.4}
.cookie-text a{font-size:13px;font-weight:600;color:#ea580c;text-decoration:none}
.cookie-text a:hover{text-decoration:underline}
.cookie-actions{display:flex;gap:10px;flex-shrink:0}
.btn{padding:8px 18px;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;border:none;transition:all 0.2s}
.btn-decline{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-decline:hover{background:#334155}
.btn-accept{background:#38bdf8;color:#fff}
.btn-accept:hover{background:#0ea5e9}
@media(max-width:640px){.cookie-banner{flex-direction:column;text-align:center;padding:12px}.cookie-content{flex-direction:column;gap:8px}.cookie-actions{width:100%;justify-content:center}}
</style>
<script>
// Cookie consent handling (non-essential cookies stored only when accepted)
document.addEventListener('DOMContentLoaded', function () {
  var cookieBanner = document.getElementById('cookie-banner');
  var acceptBtn = document.getElementById('accept-cookies-btn');
  var denyBtn = document.getElementById('deny-cookies-btn');

  // Check if a preference was already saved
  var consent = localStorage.getItem('cookieConsent') || localStorage.getItem('cookie_consent');
  if (consent) {
    if (cookieBanner) cookieBanner.style.display = 'none';
    if (consent === 'accepted') {
      enableNonEssentialCookies();
    } else {
      blockNonEssentialCookies();
    }
  } else if (cookieBanner) {
    setTimeout(function () { cookieBanner.classList.add('show'); }, 1000);
  }

  // Handle Accept click - store non-essential cookies
  if (acceptBtn && cookieBanner) {
    acceptBtn.addEventListener('click', function () {
      localStorage.setItem('cookieConsent', 'accepted');
      cookieBanner.style.opacity = '0';
      cookieBanner.style.transition = 'opacity 0.3s ease';
      setTimeout(function () { cookieBanner.style.display = 'none'; }, 300);
      enableNonEssentialCookies();
    });
  }

  // Handle Deny click - do not store non-essential cookies
  if (denyBtn && cookieBanner) {
    denyBtn.addEventListener('click', function () {
      localStorage.setItem('cookieConsent', 'denied');
      cookieBanner.style.opacity = '0';
      cookieBanner.style.transition = 'opacity 0.3s ease';
      setTimeout(function () { cookieBanner.style.display = 'none'; }, 300);
      blockNonEssentialCookies();
    });
  }
});

function enableNonEssentialCookies() {
  document.cookie = 'non_essential_consent=accepted; path=/; max-age=31536000; SameSite=Lax';
  console.log('Cookies accepted: Non-essential cookies stored.');
}

function blockNonEssentialCookies() {
  document.cookie = 'non_essential_consent=; path=/; max-age=0; SameSite=Lax';
  console.log('Cookies denied: Non-essential cookies not stored.');
}
(function(){var c=localStorage.getItem("cookie_consent");var b=document.getElementById("cookie-banner");if(!c&&b){setTimeout(function(){b.classList.add("show")},1000)}})();
</script></body>
</html>
