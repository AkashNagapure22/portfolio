<script>
    if (window.lucide) lucide.createIcons();

    // Explicit Isolated Page Key for Coins Portfolio
    const ARTICLE_ID = 'coins';
    const API_URL = '/api/comments';

    async function loadComments() {
        const container = document.getElementById('comments-container');
        try {
            const response = await fetch(`${API_URL}?article_id=${encodeURIComponent(ARTICLE_ID)}`);
            const comments = await response.json();

            if (!response.ok) throw new Error();

            if (!comments || comments.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No comments yet. Be the first to start the discussion!</p>';
                return;
            }

            const commentMap = {};
            const topLevelComments = [];

            comments.forEach(comment => {
                comment.replies = [];
                commentMap[comment.id] = comment;
                if (comment.parent_id) {
                    if (commentMap[comment.parent_id]) {
                        commentMap[comment.parent_id].replies.push(comment);
                    }
                } else {
                    topLevelComments.push(comment);
                }
            });

            container.innerHTML = topLevelComments.map(comment => renderCommentNode(comment)).join('');
            if (window.lucide) lucide.createIcons();
        } catch (err) {
            container.innerHTML = '<p class="text-slate-400 text-sm">Discussion thread offline (mock mode active).</p>';
        }
    }

    function renderCommentNode(comment) {
        const formattedDate = new Date(comment.created_at || Date.now()).toLocaleString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
        });

        const repliesHTML = comment.replies && comment.replies.length > 0 
            ? `<div class="mt-4 pl-4 md:pl-6 border-l-2 border-amber-500/20 space-y-4">
                ${comment.replies.map(reply => renderCommentNode(reply)).join('')}
               </div>`
            : '';

        return `
            <div class="p-4 bg-slate-900/80 border border-slate-800 rounded-lg space-y-3" id="comment-${comment.id}">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span class="font-bold text-amber-400 text-sm">${escapeHTML(comment.author || 'Anonymous')}</span>
                    <span class="text-slate-500">${formattedDate}</span>
                </div>
                <p class="text-slate-300 text-sm whitespace-pre-line">${escapeHTML(comment.content || '')}</p>
                <div class="flex items-center space-x-4 text-xs pt-1">
                    <button onclick="handleVote(${comment.id}, 'like')" class="inline-flex items-center space-x-1 text-slate-400 hover:text-emerald-400 transition-colors">
                        <span class="material-symbols-outlined text-sm">thumb_up</span>
                        <span>${comment.likes || 0}</span>
                    </button>
                    <button onclick="handleVote(${comment.id}, 'dislike')" class="inline-flex items-center space-x-1 text-slate-400 hover:text-rose-400 transition-colors">
                        <span class="material-symbols-outlined text-sm">thumb_down</span>
                        <span>${comment.dislikes || 0}</span>
                    </button>
                    <button onclick="toggleReplyForm(${comment.id})" class="inline-flex items-center space-x-1 text-amber-400 hover:text-amber-300 font-semibold transition-colors">
                        <span class="material-symbols-outlined text-sm">reply</span>
                        <span>Reply</span>
                    </button>
                </div>
                <form id="reply-form-${comment.id}" class="hidden space-y-3 mt-3 pt-3 border-t border-slate-800">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="reply-author-${comment.id}" placeholder="Your Name *" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                        <input type="email" id="reply-email-${comment.id}" placeholder="Your Email *" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                    </div>
                    <textarea id="reply-content-${comment.id}" rows="2" placeholder="Write a reply..." required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"></textarea>
                    <div class="flex space-x-2">
                        <button type="button" onclick="postReply(${comment.id})" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded">Submit Reply</button>
                        <button type="button" onclick="toggleReplyForm(${comment.id})" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded">Cancel</button>
                    </div>
                </form>
                ${repliesHTML}
            </div>
        `;
    }

    function toggleReplyForm(commentId) {
        document.getElementById(`reply-form-${commentId}`).classList.toggle('hidden');
    }

    async function handleVote(id, action) {
        try {
            await fetch(API_URL, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, action })
            });
            await loadComments();
        } catch (err) {
            console.error('Vote action simulation');
        }
    }

    async function postReply(parentId) {
        const author = document.getElementById(`reply-author-${parentId}`).value;
        const email = document.getElementById(`reply-email-${parentId}`).value;
        const content = document.getElementById(`reply-content-${parentId}`).value;
        if (!author.trim() || !email.trim() || !content.trim()) {
            alert('Please fill out all required fields.');
            return;
        }
        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author, email, content, parent_id: parentId, article_id: ARTICLE_ID })
            });
            await loadComments();
        } catch (err) {
            alert('Reply posted.');
        }
    }

    const commentForm = document.getElementById('comment-form');
    if (commentForm) {
        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const author = document.getElementById('author').value;
            const email = document.getElementById('email').value;
            const content = document.getElementById('content').value;

            btn.disabled = true;
            btn.innerText = 'Posting...';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, email, content, parent_id: null, article_id: ARTICLE_ID })
                });
                document.getElementById('author').value = '';
                document.getElementById('email').value = '';
                document.getElementById('content').value = '';
                await loadComments();
            } catch (err) {
                alert('Comment submitted successfully.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Post Comment';
            }
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    loadComments();

    // Mobile Navigation Drawer Toggle
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu-drawer');
        const icon = document.getElementById('menu-icon');
        menu.classList.toggle('hidden');
        icon.textContent = menu.classList.contains('hidden') ? 'menu' : 'close';
    }

    function closeMobileMenu() {
        document.getElementById('mobile-menu-drawer').classList.add('hidden');
        document.getElementById('menu-icon').textContent = 'menu';
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleQuickJump() {
        document.getElementById('quick-jump-menu').classList.toggle('hidden');
    }

    // Hero Carousel Logic
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-slide');

    function showSlide(index) {
        slides.forEach(s => s.classList.remove('active'));
        if (slides[index]) slides[index].classList.add('active');
    }

    function nextSlide() {
        if (slides.length === 0) return;
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        if (slides.length === 0) return;
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }

    if (slides.length > 0) {
        setInterval(nextSlide, 7000);
    }
</script>
